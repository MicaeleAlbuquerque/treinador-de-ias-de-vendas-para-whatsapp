<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{padding:24px;background:var(--via-bg)}
  .state{display:flex;flex-direction:column;align-items:center;text-align:center}
  .illus{width:96px;height:96px;display:flex;align-items:center;justify-content:center;border-radius:var(--via-radius-pill);background:var(--via-blue-light);box-shadow:0 0 0 8px rgba(10,79,149,.06)}
  .illus svg{width:40px;height:40px;color:var(--via-blue)}
  h3{font:var(--via-fw-bold) 20px var(--via-font);margin:16px 0 6px;color:var(--via-navy)}
  p{font-size:14px;color:var(--via-color-text-muted);max-width:34ch;margin:0;font-weight:300;line-height:1.5}
  .tip{font-size:12px;color:var(--via-color-text-muted);margin-top:14px}
  .tip b{color:var(--via-navy)}
</style></head><body>
<div class="state">
  <div class="illus"><i data-lucide="mail" stroke-width="1.5"></i></div>
  <h3>Nenhum envelope ainda</h3>
  <p>Crie seu primeiro envelope para enviar documentos para assinatura digital.</p>
  <span class="tip"><b>Dica:</b> você pode criar a partir de templates.</span>
</div>
<script>lucide.createIcons()</script>
</body></html>
