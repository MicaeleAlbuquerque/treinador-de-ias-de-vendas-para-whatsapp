<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--via-bg);display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 150px;min-width:150px;border-radius:var(--via-radius-lg);overflow:hidden;border:var(--via-border);background:var(--via-white)}
  .sw .col{height:84px}
  .sw .lab{padding:10px 12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .sw .lab b{color:var(--via-navy);font-weight:var(--via-fw-bold);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .sw .lab span{color:var(--via-color-text-muted);font-family:var(--via-font-mono);font-size:10px}
</style></head><body>
<div class="sw"><div class="col" style="background:var(--via-navy)"></div><div class="lab"><b>Navy</b><span>#02162A</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-blue)"></div><div class="lab"><b>Blue</b><span>#0A4F95</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-blue-light);border-bottom:var(--via-border)"></div><div class="lab"><b>Blue Light</b><span>#E8F0FB</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-navy-80)"></div><div class="lab"><b>Navy 80</b><span>rgba/.80</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-navy-40)"></div><div class="lab"><b>Navy 40</b><span>rgba/.40</span></div></div>
</body></html>
