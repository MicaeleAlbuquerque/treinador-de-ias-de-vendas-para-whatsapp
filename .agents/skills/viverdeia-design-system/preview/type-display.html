<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

<div class="row"><span class="lab">display</span><span class="via-display">Viver de IA</span><span class="spec">900 · 48/1.1</span></div>

<div class="row"><span class="lab">h2</span><span class="via-h2">Soluções prontas de IA</span><span class="spec">900 · 28/1.1</span></div>
<div class="row"><span class="lab">h3</span><span class="via-h3">Últimos Envelopes</span><span class="spec">900 · 20/1.5</span></div>
<div class="row"><span class="lab">wordmark</span><span class="via-wordmark">Viver de IA</span><span class="spec">300 · .22em</span></div>
