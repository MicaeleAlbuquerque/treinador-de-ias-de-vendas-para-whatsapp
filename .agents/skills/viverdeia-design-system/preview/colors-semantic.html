<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--via-bg);display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 160px;min-width:160px;border-radius:var(--via-radius-lg);overflow:hidden;border:var(--via-border);background:var(--via-white)}
  .sw .col{height:72px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:var(--via-fw-bold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  .sw .lab{padding:8px 12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .sw .lab b{color:var(--via-navy);font-weight:var(--via-fw-bold);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .sw .lab span{color:var(--via-color-text-muted);font-family:var(--via-font-mono);font-size:10px}
</style></head><body>
<div class="sw"><div class="col" style="background:var(--via-success)">Sucesso</div><div class="lab"><b>Success</b><span>#1F8A5C</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-warning)">Atenção</div><div class="lab"><b>Warning</b><span>#B8740D</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-danger)">Erro</div><div class="lab"><b>Danger</b><span>#B63A2F</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-blue)">Info</div><div class="lab"><b>Info</b><span>#0A4F95</span></div></div>
</body></html>
