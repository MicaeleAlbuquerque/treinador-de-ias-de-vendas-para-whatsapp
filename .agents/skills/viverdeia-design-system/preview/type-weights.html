<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--via-bg)}
  .row{display:flex;align-items:baseline;gap:14px;padding:6px 0}
  .lab{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono);width:112px;flex:0 0 112px}
  .spec{color:var(--via-color-text-muted);font-size:10px;margin-left:auto;white-space:nowrap;font-family:var(--via-font-mono)}
</style></head><body>
<div class="row"><span class="lab">Light · 300</span><span style="font:300 22px var(--via-font);color:var(--via-navy)">Viver de IA — Light</span><span class="spec">corpo</span></div>
<div class="row"><span class="lab">Light italic · 300</span><span style="font:italic 300 22px var(--via-font);color:var(--via-navy)">Viver de IA — Light Oblique</span><span class="spec">ênfase sutil</span></div>
<div class="row"><span class="lab">Roman · 400</span><span style="font:400 22px var(--via-font);color:var(--via-navy)">Viver de IA — Roman</span><span class="spec">UI, inputs</span></div>
<div class="row"><span class="lab">Roman italic · 400</span><span style="font:italic 400 22px var(--via-font);color:var(--via-navy)">Viver de IA — Oblique</span><span class="spec">citações</span></div>
<div class="row"><span class="lab">Heavy · 900</span><span style="font:900 22px var(--via-font);color:var(--via-navy)">Viver de IA — Heavy</span><span class="spec">títulos, botões</span></div>
</body></html>
