<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{padding:20px;background:var(--via-bg);display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .stat{position:relative;padding:var(--via-space-5) var(--via-space-6);background:var(--via-white);border:var(--via-border);border-radius:var(--via-radius-lg)}
  .stat .ic{position:absolute;top:var(--via-space-4);right:var(--via-space-4);background:var(--via-blue-light);color:var(--via-blue);border-radius:var(--via-radius-md);padding:8px;display:flex}
  .stat .ic svg{width:18px;height:18px}
  .delta{font-size:13px;color:var(--via-success);margin-top:6px;font-weight:var(--via-fw-bold)}
</style></head><body>
<div class="stat">
  <span class="ic"><i data-lucide="clock"></i></span>
  <div class="via-stat-label">Pendentes</div>
  <div class="via-stat-value">24</div>
  <div class="delta">+3 esta semana</div>
</div>
<div class="stat">
  <span class="ic" style="background:#E6F4ED;color:var(--via-success)"><i data-lucide="check-circle"></i></span>
  <div class="via-stat-label">Assinados hoje</div>
  <div class="via-stat-value">7</div>
  <div class="delta">+18% vs ontem</div>
</div>
<script>lucide.createIcons()</script>
</body></html>
