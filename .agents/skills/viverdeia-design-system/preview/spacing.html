<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--via-bg)}
  .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .bar{height:14px;background:var(--via-blue);border-radius:2px;opacity:.9}
  .lab{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono);width:88px;flex:0 0 88px}
  .val{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono);margin-left:auto}
</style></head><body>
<div class="row"><span class="lab">space-1 · 4</span><div class="bar" style="width:4px"></div><span class="val">gap-1</span></div>
<div class="row"><span class="lab">space-2 · 8</span><div class="bar" style="width:8px"></div><span class="val">gap-2</span></div>
<div class="row"><span class="lab">space-3 · 12</span><div class="bar" style="width:12px"></div><span class="val">gap-3</span></div>
<div class="row"><span class="lab">space-4 · 16</span><div class="bar" style="width:16px"></div><span class="val">cartão p</span></div>
<div class="row"><span class="lab">space-6 · 24</span><div class="bar" style="width:24px"></div><span class="val">seção</span></div>
<div class="row"><span class="lab">space-8 · 32</span><div class="bar" style="width:32px"></div><span class="val">y</span></div>
<div class="row"><span class="lab">space-12 · 48</span><div class="bar" style="width:48px"></div><span class="val">py</span></div>
<div class="row"><span class="lab">space-20 · 80</span><div class="bar" style="width:80px"></div><span class="val">via-section</span></div>
</body></html>
