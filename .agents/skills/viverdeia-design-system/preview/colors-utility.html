<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--via-bg)}
  h4{font:var(--via-fw-bold) 13px var(--via-font);color:var(--via-color-text-muted);text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:var(--via-radius-pill);font-size:12px;font-weight:var(--via-fw-bold);background:var(--via-white);border:1px solid var(--via-color-border)}
  .dot{width:10px;height:10px;border-radius:50%}
  .lab{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono);margin-left:4px}
</style></head><body>
<h4>Paleta utilitária — tags, categorias, séries de gráfico</h4>
<div class="row">
  <span class="chip"><span class="dot" style="background:var(--via-signer-1)"></span>Vendas<span class="lab">#0A4F95</span></span>
  <span class="chip"><span class="dot" style="background:var(--via-signer-2)"></span>Marketing<span class="lab">#1F8A5C</span></span>
  <span class="chip"><span class="dot" style="background:var(--via-signer-3)"></span>CS<span class="lab">#B8740D</span></span>
  <span class="chip"><span class="dot" style="background:var(--via-signer-4)"></span>Financeiro<span class="lab">#B63A2F</span></span>
  <span class="chip"><span class="dot" style="background:var(--via-signer-5)"></span>Produto<span class="lab">#5B3FA0</span></span>
  <span class="chip"><span class="dot" style="background:var(--via-signer-6)"></span>RH<span class="lab">#0F7A8C</span></span>
</div>
</body></html>
