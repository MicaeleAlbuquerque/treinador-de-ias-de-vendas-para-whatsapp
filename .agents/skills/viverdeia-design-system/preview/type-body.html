<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--via-bg)}
  .row{display:flex;align-items:baseline;gap:14px;padding:8px 0;border-bottom:1px dashed var(--via-color-border)}
  .row:last-child{border-bottom:0}
  .lab{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono);width:72px;flex:0 0 72px}
  .spec{color:var(--via-color-text-muted);font-size:10px;margin-left:auto;white-space:nowrap;font-family:var(--via-font-mono)}
</style></head><body>
<div class="row"><span class="lab">body</span><span class="via-body">Plug & Play para implementar IA na sua empresa de forma imediata.</span><span class="spec">300 · 16/1.7</span></div>
<div class="row"><span class="lab">body-bold</span><span class="via-body-bold">Você escolhe, personaliza e aplica no mesmo dia.</span><span class="spec">900 · 16</span></div>
<div class="row"><span class="lab">sm</span><span class="via-sm">Baseado em 12 envelopes concluídos nos últimos 30 dias.</span><span class="spec">300 · 14</span></div>
<div class="row"><span class="lab">label</span><span class="via-label">Soluções de IA</span><span class="spec">900 · 10, .12em</span></div>
</body></html>
