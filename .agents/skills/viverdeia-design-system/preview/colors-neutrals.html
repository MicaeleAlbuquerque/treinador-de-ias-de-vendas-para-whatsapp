<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--via-bg);display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1 1 150px;min-width:150px;border-radius:var(--via-radius-lg);overflow:hidden;border:var(--via-border);background:var(--via-white)}
  .sw .col{height:84px}
  .sw .lab{padding:10px 12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .sw .lab b{color:var(--via-navy);font-weight:var(--via-fw-bold);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
  .sw .lab span{color:var(--via-color-text-muted);font-family:var(--via-font-mono);font-size:10px}
</style></head><body>
<div class="sw"><div class="col" style="background:var(--via-white);border-bottom:var(--via-border)"></div><div class="lab"><b>White</b><span>#FFFFFF</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-bg);border-bottom:var(--via-border)"></div><div class="lab"><b>BG</b><span>#F9F9F9</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-bg-2);border-bottom:var(--via-border)"></div><div class="lab"><b>BG-2</b><span>#F0F2F5</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-navy-15)"></div><div class="lab"><b>Border</b><span>navy/.15</span></div></div>
<div class="sw"><div class="col" style="background:var(--via-navy-06)"></div><div class="lab"><b>Subtle</b><span>navy/.06</span></div></div>
<div class="sw"><div class="col" style="background:#1C2B3A"></div><div class="lab"><b>Text Body</b><span>#1C2B3A</span></div></div>
<div class="sw"><div class="col" style="background:#6B7A8D"></div><div class="lab"><b>Muted</b><span>#6B7A8D</span></div></div>
</body></html>
