<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{padding:18px;background:var(--via-bg)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--via-white);border:var(--via-border);border-radius:var(--via-radius-md);box-shadow:var(--via-shadow-card)}
  .lab{font-size:14px;font-weight:var(--via-fw-bold);color:var(--via-navy)}
</style></head><body>
<div class="bar">
  <span class="lab">3 envelope(s) selecionado(s)</span>
  <div style="display:flex;gap:8px">
    <button class="via-btn via-btn-danger via-btn-sm"><i data-lucide="x-circle" style="width:14px;height:14px"></i>Cancelar</button>
    <button class="via-btn via-btn-secondary via-btn-sm"><i data-lucide="send" style="width:14px;height:14px"></i>Reenviar</button>
    <button class="via-btn via-btn-secondary via-btn-sm">Limpar</button>
  </div>
</div>
<script>lucide.createIcons()</script>
</body></html>
