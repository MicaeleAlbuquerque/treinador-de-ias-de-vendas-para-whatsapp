<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:24px;background:var(--via-bg);display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
  .t{display:flex;flex-direction:column;align-items:center;gap:6px}
  .sq{background:var(--via-navy);opacity:.9}
  .lab{font-size:10px;color:var(--via-color-text-muted);font-family:var(--via-font-mono)}
</style></head><body>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-sm)"></div><span class="lab">sm · 4</span></div>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-md)"></div><span class="lab">md · 8</span></div>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-lg)"></div><span class="lab">lg · 12</span></div>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-xl)"></div><span class="lab">xl · 20</span></div>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-2xl)"></div><span class="lab">2xl · 32</span></div>
<div class="t"><div class="sq" style="width:56px;height:56px;border-radius:var(--via-radius-pill)"></div><span class="lab">pill</span></div>
</body></html>
