<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Assina.ai — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-base)}
  #root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="EnvelopesList.jsx"></script>
<script type="text/babel">
function App(){
  const [route, setRoute] = React.useState('landing');
  const user = { name: 'Rafael Milagre', role: 'admin' };
  const titles = { dashboard: 'Dashboard', envelopes: 'Envelopes', documents: 'Documentos', templates: 'Templates', users: 'Usuários', settings: 'Configurações', reminders: 'Régua de Lembretes', profile: 'Perfil' };
  React.useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [route]);
  if (route === 'landing') return <Landing onLogin={() => setRoute('login')} />;
  if (route === 'login') return <Login onSuccess={() => setRoute('dashboard')} />;
  return (
    <AppShell current={route} onNavigate={setRoute} onSignOut={() => setRoute('landing')} title={titles[route] || 'Assina.ai'} user={user}>
      {route === 'dashboard' && <Dashboard onGo={setRoute} />}
      {route === 'envelopes' && <EnvelopesList />}
      {!['dashboard','envelopes'].includes(route) && (
        <div className="vi-card" style={{textAlign:'center',padding:48}}>
          <Icon name="construction" size={28} style={{color:'var(--text-tertiary)'}} />
          <h3 style={{font:'var(--text-h5)',margin:'12px 0 4px'}}>{titles[route]}</h3>
          <p className="body-sm muted" style={{margin:0}}>Tela em construção — padrões de layout seguem o mesmo shell.</p>
        </div>
      )}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
